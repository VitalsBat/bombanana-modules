<!DOCTYPE html>
<html>
  <head>
    <title>Lock Module</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../shared/common.css">
    <script src="../shared/common.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
      <h1 class="title">Lock Module</h1>
      <div class="horizontal-container">
        <div class="vertical-container" style="padding: 12px">
          <div class="cross">
            <span>X</span>
            <span>X</span>
            <span>X</span>
          </div>
          <br>
          <div class="module">
            <div class="phases">
              <div class="phase"></div>
            </div>
            <div class="horizontal-container" style="width: 100%;">
              <div class="wheel-panel"></div>
              <div class="vertical-container" style="padding: 0">
                <div class="light green"></div>
                <button type="button" class="wheel">
                  <div class="braille" data-number="1"></div>
                </button>
                <img class="symbol" data-name="CurvedHour"></img>
              </div>
              <div class="vertical-container" style="padding: 0">
                <div class="light blue"></div>
                <button class="wheel">
                  <div class="braille" data-number="1"></div>
                </button>
                <img class="symbol" data-name="SolidStar"></img>
              </div>
              <div class="vertical-container" style="padding: 0">
                <div class="light red"></div>
                <button class="wheel">
                  <div class="braille" data-number="1"></div>
                </button>
                <img class="symbol" data-name="DownTriangle"></img>
              </div>
              <div class="vertical-container" style="padding: 0">
                <div class="light yellow"></div>
                <button class="wheel">
                  <div class="braille" data-number="1"></div>
                </button>
                <img class="symbol" data-name="SquareCircle"></img>
              </div>
              <div class="vertical-container">
                <button class="v-enter"></button>
              </div>
            </div>
          </div>
        </div>

        <div class="vertical-container">
          <img src="Lock-Module IMG.png"
          style="display: block; margin: 0 auto">
        </div>
      </div>
  </body>
</html>
