<!DOCTYPE html>
<html>
  <head>
    <title>Morse Module</title>
    <link rel="stylesheet" href="../shared/common.css">
    <link rel="stylesheet" href="styles.css" />
    <script src="../shared/common.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1 class="title">Morse Module</h1>
    <div class="horizontal-container">
      <div class="vertical-container" style="padding: 12px">
        <div class="cross">
          <span>X</span>
          <span>X</span>
          <span>X</span>
        </div>
        <br>
        <div class="module">
          <div class="phases">
            <div class="phase"></div>
          </div>
          <div class="vertical-container" style="width: 100%;">
            <div class="horizontal-container" style="gap:20px; width: 100%">
              <button class="upbutton"></button>
              <button class="upbutton"></button>
              <button class="upbutton"></button>
              <button class="upbutton"></button>
            </div>
            <div class="horizontal-container" style="gap:20px; width: 100%">
              <div class="screen">0</div>
              <div class="screen">0</div>
              <div class="screen">0</div>
              <div class="screen">0</div>
            </div>
            <button class="enter" style="margin: 20px 0 20px 0"></button>
          </div>
        </div>
      </div>

      <div class="vertical-container">
        <img src="Morse-Module IMG.png"
          style="display: block; margin: 0 auto">
      </div>
    </div>
  </body>
</html>
