<!DOCTYPE html>
<html>
  <head>
    <title>Soundboard Module</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../shared/common.css">
    <script src="../shared/common.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
      <h1 class="title">Soundboard Module</h1>
      <div class="horizontal-container">
        <div class="vertical-container" style="padding: 12px">
          <div class="cross">
            <span>X</span>
            <span>X</span>
            <span>X</span>
          </div>
          <br>
          <div class="module">
            <div class="phases">
              <div class="phase"></div>
              <div class="phase"></div>
            </div>
            <div class="horizontal-container" style="width: 100%; height: 100%">
              <div class="board">
                <button class="blue">
                  <div class="braille" data-number="2"></div>
                </button>
                <button class="red">
                  <div class="braille" data-number="7"></div>
                </button>
                <button class="yellow">
                  <div class="braille" data-number="4"></div>
                </button>
                <button class="green">
                  <div class="braille" data-number="5"></div>
                </button>
                <button class="yellow">
                  <div class="braille" data-number="6"></div>
                </button>
                <button class="red">
                  <div class="braille" data-number="9"></div>
                </button>
                <button class="yellow">
                  <div class="braille" data-number="1"></div>
                </button>
                <button class="blue">
                  <div class="braille" data-number="3"></div>
                </button>
                <button class="green">
                  <div class="braille" data-number="8"></div>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="vertical-container">
        <img src="Soundboard-Module IMG.png"
          style="display: block; margin: 0 auto">
        </div>
      </div>
  </body>
</html>
