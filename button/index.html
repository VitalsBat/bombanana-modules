<!DOCTYPE html>
  <head>
    <title>Button Module</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../shared/common.css">
    <script src="../shared/common.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1 class="title">Button Module</h1>
    <div class="horizontal-container">
      <div class="vertical-container" style="padding: 12px">
        <div class="cross">
          <span>X</span>
          <span>X</span>
          <span>X</span>
        </div>
        <br>
        <div class="module">
          <div class="phases">
            <div class="phase"></div>
          </div>
          <div class="horizontal-container" style="width: 100%">
            <div class="vertical-container">
              <div class="screen">0</div>
              <button class="gray"></button>
              <div class="light yellow"></div>
            </div>
            <div class="vertical-container">
              <div class="screen">0</div>
              <button class="gray"></button>
              <div class="light red"></div>
            </div>
            <div class="vertical-container">
              <div class="screen">0</div>
              <button class="gray"></button>
              <div class="light blue"></div>
            </div>
            <div class="vertical-container">
              <div class="screen">0</div>
              <button class="gray"></button>
              <div class="light green"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="vertical-container">
        <img src="Button-Module IMG.png"
          style="display: block; margin: 0 auto">
      </div>
    </div>
  </body>
</html>
