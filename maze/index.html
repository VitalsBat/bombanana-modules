<!DOCTYPE html>
  <head>
    <title>Maze Module</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../shared/common.css">
    <script src="../shared/common.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1 class="title">Maze Module</h1>
    <div class="horizontal-container">
      <div class="vertical-container" style="padding: 12px">
        <div class="cross">
          <span>X</span>
          <span>X</span>
          <span>X</span>
        </div>
        <br>
        <div class="module">
          <div class="phases">
            <div class="phase"></div>
          </div>
          <div class="vertical-container" style="width: 30%; gap: 45px">
            <div class="braille-panel">
              <div class="braille" data-number="3" style="width: 100%"></div>
            </div>
            <div class="direction-pad">
              <button class="direction-button up"></button>
              <button class="direction-button right"></button>
              <button class="direction-button down"></button>
              <button class="direction-button left"></button>
            </div>
          </div>
          <div class="maze-panel">
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light red"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light green"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
          </div>
        </div>
      </div>

      <div class="vertical-container">
        <img src="Maze-Module IMG.png"
          style="display: block; margin: 0 auto">
      </div>
    </div>
  </body>
</html>
