<!DOCTYPE html>
<html>
  <head>
    <title>Switch Module</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../shared/common.css">
    <script src="../shared/common.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
      <h1 class="title">Switch Module</h1>
      <div class="horizontal-container">
        <div class="vertical-container" style="padding: 12px">
          <div class="cross">
            <span>X</span>
            <span>X</span>
            <span>X</span>
          </div>
          <br>
          <div class="module">
            <div class="phases">
              <div class="phase"></div>
            </div>
            <div class="vertical-container" style="width: 100%;"">
              <div class="horizontal-container" style="gap: 15px">
                <div class="vertical-container">
                  <div class="light red"></div>
                  <div class="lever" data-state="down">
                    <div class="lever-handle"></div>
                  </div>
                  <div class="braille" data-number="6"></div>
                </div>
                <div class="vertical-container">
                  <div class="light yellow"></div>
                  <div class="lever" data-state="down">
                    <div class="lever-handle"></div>
                  </div>
                  <div class="braille" data-number="7"></div>
                </div>
                <div class="vertical-container">
                  <div class="light blue"></div>
                  <div class="lever" data-state="down">
                    <div class="lever-handle"></div>
                  </div>
                  <div class="braille" data-number="4"></div>
                </div>
                <div class="vertical-container">
                  <div class="light green"></div>
                  <div class="lever" data-state="down">
                    <div class="lever-handle"></div>
                  </div><div class="braille" data-number="1"></div>
                </div>
              </div>
              <button class="enter"></button>
            </div>
          </div>
        </div>

        <div class="vertical-container">
          <img src="Switch-Module IMG.png"
          style="display: block; margin: 0 auto">
        </div>
      </div>
  </body>
</html>
