<!DOCTYPE html>
<html>
  <head>
    <title>Symbol Module</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../shared/common.css">
    <script src="../shared/common.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1 class="title">Symbol Module</h1>
    <div class="horizontal-container">
      <div class="vertical-container" style="padding: 12px">
        <div class="cross">
          <span>X</span>
          <span>X</span>
          <span>X</span>
        </div>
        <br>
        <div class="module">
          <div class="phases">
            <div class="phase"></div>
            <div class="phase"></div>
            <div class="phase"></div>
            <div class="phase"></div>
          </div>
          <div class="horizontal-container" style="width: 100%; height: 100%">
            <div class="invisgrid">
              <div class="circle-panel"></div>
              <img class="symbol" data-name="CircleSquare"></img>
              <img class="symbol" data-name="UpTriangle"></img>
              <img class="symbol" data-name="SquareCircle"></img>
              <img class="symbol" data-name="Stop"></img>
              <button class="dial" type="button">
                <div class="arrow"></div>
              </button>
            </div>
            <div class="vertical-container" style="width: 30%; height: 100%; margin: 0 0 0 15px;  gap: 12px">
              <button class="ansbutton" data-color="red"></button>
              <br>
              <button class="ansbutton" data-color="green"></button>
              <br>
              <button class="ansbutton" data-color="yellow"></button>
            </div>
          </div>
          </div>
        </div>
        <div class="vertical-container">
        <img src="Symbol-Module IMG.png"
          style="display: block; margin: 0 auto">
        </div>
      </div>
  </body>
</html>
